name: Build documentation (CI)

# Netlify handles deploys (production from main, deploy previews from PRs).
# This workflow exists as a fast CI gate: it runs `mkdocs build --strict` so
# broken docs (missing nav targets, autorefs misses, etc.) fail the PR before
# Netlify even starts. Safe to delete if you prefer to rely solely on Netlify.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'understanding_its2s/**'
      - 'its2s/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'scripts/mkdocs_copy_tutorials.py'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'understanding_its2s/**'
      - 'its2s/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'scripts/mkdocs_copy_tutorials.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build documentation (strict)
        run: mkdocs build --clean --strict
