name: Tests

# Fast unit-test gate for every PR and push to main, plus the slow-marked
# statistical validation tests on a nightly schedule or on demand (label a PR
# "ci:slow", or trigger manually via workflow_dispatch).
#
# Threading is pinned to 1 throughout: the suite deadlocks under dual OpenMP
# runtimes (GH #42), and the bootstrap default n_jobs=1 is deliberately left
# alone here so that hang cannot stall CI.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  fast:
    name: Fast suite (py${{ matrix.python-version }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run fast tests
        run: pytest tests -m "not slow"

  slow:
    name: Slow statistical suite
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'ci:slow'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run slow tests
        run: pytest tests -m "slow"
