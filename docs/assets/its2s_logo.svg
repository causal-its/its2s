<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <title>its2s package icon</title>
  <desc>Icon with flowing wave layers that shift at an interruption point</desc>
  
  <g transform="translate(100, 100)">
    <!-- Outer circle with white fill, no outline -->
    <circle cx="0" cy="0" r="80" 
            fill="#ffffff" 
            stroke="none"/>
    
    <!-- Clip to circle -->
    <clipPath id="circle-clip">
      <circle cx="0" cy="0" r="80"/>
    </clipPath>
    
    <g clip-path="url(#circle-clip)">
      <!-- Flowing wave layers with darker/muted blues -->
      
      <!-- Top layer - darkest -->
      <path d="M -80 -15 Q -40 -20, 0 -15 Q 10 -13, 20 -10 Q 40 -15, 60 -25 Q 70 -30, 80 -30 L 80 -50 L -80 -50 Z" 
            fill="#4a6b8a"/>
      
      <!-- Second layer -->
      <path d="M -80 0 Q -40 -5, 0 0 Q 10 2, 20 5 Q 40 0, 60 -5 Q 70 -8, 80 -10 L 80 -30 Q 70 -30, 60 -25 Q 40 -15, 20 -10 Q 10 -13, 0 -15 Q -40 -20, -80 -15 Z" 
            fill="#6b8ba6"/>
      
      <!-- Third layer -->
      <path d="M -80 15 Q -40 10, 0 15 Q 10 17, 20 20 Q 40 18, 60 20 Q 70 22, 80 25 L 80 -10 Q 70 -8, 60 -5 Q 40 0, 20 5 Q 10 2, 0 0 Q -40 -5, -80 0 Z" 
            fill="#8ca8bf"/>
      
      <!-- Bottom layer -->
      <path d="M -80 30 Q -40 25, 0 30 Q 10 32, 20 35 Q 40 38, 60 45 Q 70 50, 80 55 L 80 25 Q 70 22, 60 20 Q 40 18, 20 20 Q 10 17, 0 15 Q -40 10, -80 15 Z" 
            fill="#b8cad9"/>
      
      <!-- Interruption marker - dark rust red vertical accent -->
      <line x1="20" y1="-60" x2="20" y2="60" 
            stroke="#712B13" 
            stroke-width="2.5" 
            opacity="0.9"/>
      
      <!-- Small geometric accent at interruption - rust red filled -->
      <circle cx="20" cy="0" r="4" 
              fill="#712B13"/>
    </g>
  </g>
</svg>
