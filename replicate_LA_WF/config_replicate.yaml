# Configuration for Palisades ITS replication.
# Mirrors the settings from:
#   LA_Wildfire_Evacuations/ITS_Evac_Codes/01_code/02_analysis/model_config.yaml
#
# Key correspondences:
#   test_days      <->  assess_split = "67 days"
#   holdout_days   <->  holdout_date = 2025-01-07, last obs = 2025-01-21 (14 days after)
#   block_length   <->  block_length_mbb = 14
#   n_sim          <->  n_sim_mbb = 1000
#   seasonality    <->  mase_seasonality = 7

periods:
  test_days: 67
  holdout_days: 14

bootstrap:
  method: "mbb"
  n_sim: 1000
  block_length: 14
  ci_method: "quantile"
  ci_level: 0.95
  n_jobs: 1

metrics:
  seasonality: 7

excess_periods:
  - name: "Full holdout (Jan 7-21 2025)"
    start_offset: 0
    end_offset: null
