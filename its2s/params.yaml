# Default configuration for ITS two-stage modular analysis.
# These are fallback values used when no override is provided. They are NOT
# hyperparameter search ranges. Tuning search spaces (bounds, scale, dtype)
# are defined in its2s/tuning.py (_ARIMA_SPACE, _NEURALPROPHET_SPACE, etc.).
#
# Override precedence (highest wins):
#   1. config_overrides dict passed at runtime
#   2. custom YAML file passed via config_path
#   3. this file
#
# After tuning, inject best_params via:
#   run_single_its(..., config_overrides={"models": {model_name: result.best_params}})

data:
  date_col: "ds"
  target_col: "y"
  covariate_cols: []
  missing_data: "error"   # "error", "drop", or "interpolate"

periods:
  split_method: percent       # "percent" (default) | "days" | "observations"
  # Window sizes default in code per family (prepare_splits): percent
  # test_pct 0.20 / holdout_pct 1.0, days test_days 365 / holdout_days 365,
  # observations required with no defaults. They are NOT set here: only the
  # family matching split_method may appear in config, and keys from another
  # family raise instead of being silently ignored (GH #28, #54), so defaults
  # for every family in this file would make the non-default methods
  # unreachable. Set keys for the chosen family only, e.g.:
  # test_pct: 0.20            # percent: fraction of pre-intervention observations
  # holdout_pct: 1.0          # percent: fraction of post-intervention observations
  # test_days: 365            # days: calendar days, whatever the series frequency
  # holdout_days: 365         # days: calendar days, whatever the series frequency
  # test_obs: 52              # observations: row counts; required, no defaults
  # holdout_obs: 52
  min_test_obs: 30            # warn when the realized test window has fewer observations (0 disables); GH #29

models:
  prophet_xgb:
    prophet:
      yearly_seasonality: true
      weekly_seasonality: true
      daily_seasonality: false
      changepoint_prior_scale: 0.05
    xgb:
      n_estimators: 300
      max_depth: 6
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_weight: 3
      gamma: 1.0

  prophet_then_xgb:
    prophet:
      yearly_seasonality: true
      weekly_seasonality: true
      daily_seasonality: false
      changepoint_prior_scale: 0.05
    xgb:
      n_estimators: 300
      max_depth: 6
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_weight: 3
      gamma: 1.0

  neuralprophet:
    n_lags: 14
    yearly_seasonality: true
    weekly_seasonality: true
    learning_rate: 0.01
    epochs: 100
    batch_size: 64

  arima:
    max_p: 5
    max_d: 2
    max_q: 5
    seasonal: true
    m: 7
    stepwise: true
    suppress_warnings: true

bootstrap:
  method: "mbb"
  n_sim: 1000
  block_length: 14
  ci_method: "quantile"
  ci_level: 0.95
  n_jobs: 1

metrics:
  seasonality: 7

output:
  format: "csv"
  plot_dpi: 150
  plot_figsize: [14, 6]
  # Sequence overrides map to: fit, counterfactual/CI, intervention, holdout.
  # Dict overrides may also include observed.
  plot_colors:
    fit: "#2166AC"
    counterfactual: "#B2182B"
    intervention: "#4DAF4A"
    holdout: "#FEE08B"
    observed: "#333333"
  plot_font_sizes:
    title: 22
    axis_label: 20
    tick: 18
    legend: 18

parallel:
  n_jobs: 1

excess_periods: []
# Example excess_periods. Offsets are unit-explicit: delimit each period with
# EITHER start_offset_days/end_offset_days (calendar days from the holdout
# start, inclusive end) OR start_offset_obs/end_offset_obs (observation
# counts into the holdout, inclusive end). Mixing the two families in one
# period raises; the legacy start_offset/end_offset keys are rejected.
# - name: "First 30 days"
#   start_offset_days: 0
#   end_offset_days: 30
# - name: "First 4 observations"
#   start_offset_obs: 0
#   end_offset_obs: 3
# - name: "Full holdout"
#   start_offset_obs: 0
#   end_offset_obs: null

tuning:
  split_method: percent
  n_folds: 5
  # Window sizes default in code per family (get_tuning_config): percent
  # test_pct 0.10 / min_train_pct 0.50 / skip_pct 0.0, observations
  # test_obs 365 / min_train_obs 730 / skip_obs 0. They are NOT set here:
  # only the window family matching split_method may appear in config, and
  # keys from the other family raise instead of being silently ignored
  # (GH #55), so defaults for both families in this file would make one
  # family unreachable. Set keys for the chosen family only, e.g.:
  # test_pct: 0.10            # CV fold test window = 10% of pre-intervention
  # test_obs: 365             # CV windows are observation counts, never
  # min_train_obs: 730        # calendar days (GH #39); these equal calendar
  # skip_obs: 0               # days only on daily data
  metric: "rmse"
  n_jobs: 1
  seed: 42
  # cv_end_date is not a config key: it is derived at runtime from the
  # 'periods' split so tuning folds stay out of the held-out test window
  # (GH #40); pass cv_end_date to tune_model to override.
  # Default trial counts per model (matches R reference grid sizes)
  model_defaults:
    prophet_xgb: 100
    prophet_then_xgb: 100
    neuralprophet: 75
    arima: 100
