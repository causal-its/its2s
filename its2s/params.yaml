# Default configuration for ITS two-stage modular analysis.
# These are fallback values used when no override is provided. They are NOT
# hyperparameter search ranges. Tuning search spaces (bounds, scale, dtype)
# are defined in its2s/tuning.py (_ARIMA_SPACE, _NEURALPROPHET_SPACE, etc.).
#
# Override precedence (highest wins):
#   1. config_overrides dict passed at runtime
#   2. custom YAML file passed via config_path
#   3. this file
#
# After tuning, inject best_params via:
#   run_single_its(..., config_overrides={"models": {model_name: result.best_params}})

data:
  date_col: "ds"
  target_col: "y"
  covariate_cols: []
  missing_data: "error"   # "error", "drop", or "interpolate"

periods:
  split_method: percent       # "percent" (default) | "days" | "observations"
  test_pct: 0.20              # used when split_method=percent (fraction of pre-intervention observations)
  holdout_pct: 1.0             # used when split_method=percent (fraction of post-intervention observations)
  test_days: 365              # used when split_method=days (calendar days, whatever the series frequency)
  holdout_days: 365           # used when split_method=days (calendar days, whatever the series frequency)
  # test_obs: 52              # used when split_method=observations (row counts; required, no defaults)
  # holdout_obs: 52
  min_test_obs: 30            # warn when the realized test window has fewer observations (0 disables); GH #29

models:
  prophet_xgb:
    prophet:
      yearly_seasonality: auto  # disabled with a visible warning when history spans < 730 days; GH #60, D-057
      weekly_seasonality: auto  # Prophet's spacing rule: off when observations are >= 7 days apart; GH #60
      daily_seasonality: false
      changepoint_prior_scale: 0.05
    xgb:
      n_estimators: 300
      max_depth: 6
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_weight: 3
      gamma: 1.0

  prophet_then_xgb:
    prophet:
      yearly_seasonality: auto  # disabled with a visible warning when history spans < 730 days; GH #60, D-057
      weekly_seasonality: auto  # Prophet's spacing rule: off when observations are >= 7 days apart; GH #60
      daily_seasonality: false
      changepoint_prior_scale: 0.05
    xgb:
      n_estimators: 300
      max_depth: 6
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_weight: 3
      gamma: 1.0

  neuralprophet:
    n_lags: 14
    yearly_seasonality: auto  # disabled with a visible warning when history spans < 730 days; GH #60, D-057
    weekly_seasonality: auto  # same rule as Prophet's, verified in neuralprophet 0.8.0; GH #60
    learning_rate: 0.01
    epochs: 100
    batch_size: 64

  arima:
    max_p: 5
    max_d: 2
    max_q: 5
    seasonal: true
    # Seasonal period for auto_arima. "auto" derives the dominant cycle from
    # the resolved series frequency (daily 7, weekly 52, monthly 12) and falls
    # back LOUDLY to m=1 (non-seasonal) when the frequency is unmapped or
    # n_train < 2m. An integer is honored exactly, never substituted: it
    # warns (but fits as asked) when n_train < 2m. Note the runtime cost:
    # weekly data resolves m=52 and the seasonal stepwise search can be slow.
    # GH #59, D-055 pattern.
    m: auto
    stepwise: true
    suppress_warnings: true

bootstrap:
  method: "mbb"
  n_sim: 1000
  block_length: 14
  ci_method: "quantile"
  ci_level: 0.95
  n_jobs: 1

metrics:
  # MASE benchmark period m. "auto" derives the dominant seasonal cycle from
  # the resolved series frequency (daily 7, weekly 52, monthly 12). An integer
  # names the benchmark explicitly (e.g. 365 for annual-on-daily) and is
  # honored or fails hard: the guard n_train >= 2m falls back to m=1 with a
  # warning on "auto", but never silently substitutes an explicit choice.
  seasonality: auto

output:
  format: "csv"
  plot_dpi: 150
  plot_figsize: [14, 6]
  # Sequence overrides map to: fit, counterfactual/CI, intervention, holdout.
  # Dict overrides may also include observed.
  plot_colors:
    fit: "#2166AC"
    counterfactual: "#B2182B"
    intervention: "#4DAF4A"
    holdout: "#FEE08B"
    observed: "#333333"
  plot_font_sizes:
    title: 22
    axis_label: 20
    tick: 18
    legend: 18

parallel:
  n_jobs: 1

excess_periods: []
# Example excess_periods. Offsets are unit-explicit: delimit each period with
# EITHER start_offset_days/end_offset_days (calendar days from the holdout
# start, inclusive end) OR start_offset_obs/end_offset_obs (observation
# counts into the holdout, inclusive end). Mixing the two families in one
# period raises; the legacy start_offset/end_offset keys are rejected.
# - name: "First 30 days"
#   start_offset_days: 0
#   end_offset_days: 30
# - name: "First 4 observations"
#   start_offset_obs: 0
#   end_offset_obs: 3
# - name: "Full holdout"
#   start_offset_obs: 0
#   end_offset_obs: null

tuning:
  split_method: percent
  n_folds: 5
  test_pct: 0.10              # CV fold test window = 10% of pre-intervention
  min_train_pct: 0.50         # initial training = 50% of pre-intervention
  skip_pct: 0.0               # gap between folds (0% = back-to-back)
  # Only the window family matching split_method may be set; keys from the
  # other family raise instead of being silently ignored (GH #55). With
  # split_method: observations, replace the three pct keys above with e.g.:
  # test_obs: 365             # CV windows are observation counts, never
  # min_train_obs: 730        # calendar days (GH #39); these equal calendar
  # skip_obs: 0               # days only on daily data
  metric: "rmse"
  n_jobs: 1
  seed: 42
  # cv_end_date is not a config key: it is derived at runtime from the
  # 'periods' split so tuning folds stay out of the held-out test window
  # (GH #40); pass cv_end_date to tune_model to override.
  # Default trial counts per model (matches R reference grid sizes)
  model_defaults:
    prophet_xgb: 100
    prophet_then_xgb: 100
    neuralprophet: 75
    arima: 100
