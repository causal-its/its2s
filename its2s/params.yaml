# Default configuration for ITS two-stage modular analysis.
# These are fallback values used when no override is provided. They are NOT
# hyperparameter search ranges. Tuning search spaces (bounds, scale, dtype)
# are defined in its2s/tuning.py (_ARIMA_SPACE, _NEURALPROPHET_SPACE, etc.).
#
# Override precedence (highest wins):
#   1. config_overrides dict passed at runtime
#   2. custom YAML file passed via config_path
#   3. this file
#
# After tuning, inject best_params via:
#   run_single_its(..., config_overrides={"models": {model_name: result.best_params}})

data:
  date_col: "ds"
  target_col: "y"
  covariate_cols: []
  missing_data: "error"   # "error", "drop", or "interpolate"

periods:
  split_method: percent       # "percent" (default) | "days"
  test_pct: 0.20              # used when split_method=percent
  holdout_pct: 1.0             # used when split_method=percent
  test_days: 365              # used when split_method=days
  holdout_days: 365           # used when split_method=days

models:
  prophet_xgb:
    prophet:
      yearly_seasonality: true
      weekly_seasonality: true
      daily_seasonality: false
      changepoint_prior_scale: 0.05
    xgb:
      n_estimators: 300
      max_depth: 6
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_weight: 3
      gamma: 1.0

  prophet_then_xgb:
    prophet:
      yearly_seasonality: true
      weekly_seasonality: true
      daily_seasonality: false
      changepoint_prior_scale: 0.05
    xgb:
      n_estimators: 300
      max_depth: 6
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_weight: 3
      gamma: 1.0

  neuralprophet:
    n_lags: 14
    yearly_seasonality: true
    weekly_seasonality: true
    learning_rate: 0.01
    epochs: 100
    batch_size: 64
    freq: "D"   # pandas offset alias; override for non-daily series (e.g. "W", "MS")

  arima:
    max_p: 5
    max_d: 2
    max_q: 5
    seasonal: true
    m: 7
    stepwise: true
    suppress_warnings: true

bootstrap:
  method: "mbb"
  n_sim: 1000
  block_length: 14
  ci_method: "quantile"
  ci_level: 0.95
  n_jobs: 1

metrics:
  seasonality: 7

output:
  format: "csv"
  plot_dpi: 150
  plot_figsize: [14, 6]

parallel:
  n_jobs: 1

excess_periods: []
# Example excess_periods:
# - name: "First 30 days"
#   start_offset: 0
#   end_offset: 30
# - name: "Full holdout"
#   start_offset: 0
#   end_offset: null

tuning:
  split_method: percent
  n_folds: 5
  test_pct: 0.10              # CV fold test window = 10% of pre-intervention
  min_train_pct: 0.50         # initial training = 50% of pre-intervention
  skip_pct: 0.0               # gap between folds (0% = back-to-back)
  test_days: 365              # used when split_method=days
  min_train_days: 730
  skip_days: 0
  metric: "rmse"
  n_jobs: 1
  seed: 42
  # Default trial counts per model (matches R reference grid sizes)
  model_defaults:
    prophet_xgb: 100
    prophet_then_xgb: 100
    neuralprophet: 75
    arima: 100
