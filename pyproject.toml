[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "its2s"
version = "0.1.0"
description = "Modular Interrupted Time Series counterfactual analysis with MBB bootstrap CIs"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "pmdarima>=2.0",
    "prophet>=1.1",
    "xgboost>=2.0",
    "neuralprophet>=0.8",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "xxhash>=3.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.pytest.ini_options]
markers = ["slow: long-running statistical validation tests"]

[tool.setuptools.packages.find]
include = ["its2s*"]
