# Conda environment for its2s. Create from the repository root:
#   conda env create -f environment.yml
#   conda activate its2s
#
# Update an existing env after editing this file:
#   conda env update -f environment.yml --prune

name: its2s
channels:
  - conda-forge
dependencies:
  - python=3.12
  # Core stack via conda-forge so `conda env update --prune` does not remove them.
  - pandas>=2.0
  - numpy>=1.24
  - scipy>=1.10
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - pyyaml>=6.0
  - python-dateutil
  # XGBoost from conda-forge (not pip): pip wheels on macOS need libomp.
  - llvm-openmp
  - xgboost>=2.0
  - pip
  - pip:
      # arch (Politis-White auto block length) via pip, NOT conda-forge arch-py:
      # the env's numpy/pandas/scipy/statsmodels are pip-managed, so conda arch-py
      # would drag in a major numpy/pandas upgrade and destabilize the neural stack.
      - arch>=6.0
      - -e .
